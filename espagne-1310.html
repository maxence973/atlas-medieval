overview:`<p class="panel-eyebrow">Année 1310</p><h2>Cinq rois et un émir</h2>
<p>La Reconquête est presque achevée depuis le milieu du XIIIe siècle. Il ne reste à l'Islam que l'émirat de Grenade, tributaire de la Castille et soutenu par les Mérinides du Maroc.</p>

<p>L'année 1310 voit la fin de la croisade commune contre Grenade, et l'Espagne se diviser sur le sort des Templiers : jugés innocents en Castille, protégés au Portugal, assiégés en Aragon.</p>
