overview:`<p class="panel-eyebrow">Année 1310</p><h2>Le royaume du roi de fer</h2>
<p>Philippe IV le Bel règne depuis 1285. Ses légistes ont brisé le pape Boniface VIII (Anagni, 1303), ses armées ont soumis la Flandre, et le procès des Templiers est en cours.</p>

<p>Le roi d'Angleterre tient la Guyenne, l'Agenais et le Ponthieu en vassal du roi de France. Cette double fidélité mènera à la guerre de Cent Ans.</p>
