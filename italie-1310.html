chronTitle:"L'Italie des Guelfes et des Gibelins, 1282‑1313",
footer:"Carte de synthèse. Les étiquettes « guelfe » et « gibelin » décrivent le parti au pouvoir en 1310 ; beaucoup de villes changeaient de camp au gré des exils. Les limites sont tracées automatiquement entre les chefs-lieux et restent approximatives.",
overview:`<p class="panel-eyebrow">Année 1310</p><h2>Guelfes contre Gibelins</h2>
<p>Le pape est parti pour Avignon, l'empereur n'est pas venu depuis soixante ans : l'Italie du Nord vit au rythme de ses communes et de leurs factions. Au sud, les Angevins de Naples et les Aragonais de Sicile se disputent l'héritage des Hohenstaufen.</p>
<div class="stats"><div><b>{N}</b><span>puissances figurées</span></div><div><b>2</b><span>rois de « Sicile »</span></div><div><b>{V}</b><span>villes</span></div></div>
<p>Henri VII arrive pour réconcilier les partis ; il finira chef des Gibelins, en guerre contre Florence et Robert de Naples.</p>
