chronTitle:"De la couronne perdue à la couronne retrouvée, 1295‑1320",
overview:`<p class="panel-eyebrow">Année 1310</p><h2>Un royaume sans roi</h2>
<p>Depuis 1138, la Pologne est divisée entre les descendants de Boleslas Bouche-Torse. Trois rois ont porté la couronne entre 1295 et 1306, puis plus personne. En 1310, Ladislas le Bref tient le sud, les fils d'Henri de Głogów le nord-ouest, les Teutoniques la mer.</p>
<div class="stats"><div><b>{N}</b><span>territoires figurés</span></div><div><b>8</b><span>duchés silésiens</span></div><div><b>{V}</b><span>villes</span></div></div>
<p>À l'est, la Lituanie païenne s'étend vers les terres ruthènes, tandis que l'ordre livonien et l'ordre teutonique la pressent par le nord et l'ouest.</p>
<p style="color:var(--muted)">Cliquez sur un territoire ou cherchez-le dans l'index.</p>`,
