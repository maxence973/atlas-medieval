chronTitle:"Après la chute d'Acre, 1291‑1311",
footer:"Carte de synthèse. Les terres latines sont entourées d'un trait doré. Hors du cadre, Gênes et Venise tiennent aussi des comptoirs en mer Noire (Caffa, Tana) ; le titre d'empereur latin de Constantinople passe en 1313 à Philippe de Tarente. Les limites sont tracées automatiquement entre les chefs-lieux et restent approximatives.",
overview:`<p class="panel-eyebrow">Année 1310</p><h2>Le dernier Orient latin</h2>
<p>Depuis 1291, les croisés ont perdu la Terre sainte. Ce qui reste de l'Orient latin vit sur la mer : Chypre, Rhodes, la Crète vénitienne, les îles de l'Égée et la Morée franque.</p>
<div class="stats"><div><b>{N}</b><span>puissances figurées</span></div><div><b>14</b><span>terres latines</span></div><div><b>{V}</b><span>villes</span></div></div>
<p>Le pape Clément V rêve encore d'une nouvelle croisade ; l'année 1310 voit surtout les Hospitaliers s'installer à Rhodes et Chypre sortir d'une crise dynastique.</p>
